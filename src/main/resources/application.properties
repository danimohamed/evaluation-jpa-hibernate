# ==========================================================================
# Configuration Hibernate de l'evaluation (fichier demande par l'enonce)
# ==========================================================================
# L'enonce impose MySQL. L'environnement d'execution ne dispose d'aucun
# serveur MySQL : la configuration ci-dessous utilise donc H2 en mode
# memoire. Le passage a MySQL ne demande que de remplacer les 4 premieres
# proprietes (driver, url, username, password) et le dialecte.
#
# Version MySQL equivalente :
#   hibernate.connection.driver_class = com.mysql.cj.jdbc.Driver
#   hibernate.connection.url          = jdbc:mysql://localhost:3306/evaluation_jpa?serverTimezone=UTC
#   hibernate.connection.username     = root
#   hibernate.connection.password     = root
#   hibernate.dialect                 = org.hibernate.dialect.MySQL8Dialect
# ==========================================================================

hibernate.connection.driver_class = org.h2.Driver
hibernate.connection.url          = jdbc:h2:mem:evaluation_jpa;DB_CLOSE_DELAY=-1
hibernate.connection.username     = sa
hibernate.connection.password     =

hibernate.dialect  = org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto = update

# Journalisation SQL : passer a true pour voir le SQL genere.
hibernate.show_sql   = false
hibernate.format_sql = true

# Contexte de persistance : une session courante par thread (utilise par
# HibernateUtil.getCurrentSession()).
hibernate.current_session_context_class = thread
